name: Release fork bundle

# Lightweight replacement for the upstream semantic-release flow.
# Builds the bundle, publishes it as a GitHub release and refreshes
# patches-bundle.json so Morphe Manager can use github.com/<owner>/<repo>
# as a patch source.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Compute version
        id: ver
        run: |
          base=$(sed -nE 's/^version *= *([^ ]+).*/\1/p' gradle.properties | sed -E 's/-dev\.[0-9]+$//')
          echo "version=${base}-y700.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid -Pversion=${{ steps.ver.outputs.version }} --no-daemon

      - name: Collect bundle
        id: bundle
        run: |
          v='${{ steps.ver.outputs.version }}'
          src=$(ls patches/build/libs/patches-*.mpp | grep -v -E 'sources|javadoc' | head -1)
          test -n "$src"
          mkdir -p dist
          cp "$src" "dist/patches-$v.mpp"
          echo "path=dist/patches-$v.mpp" >> "$GITHUB_OUTPUT"

      - name: Write patches-bundle.json
        run: |
          v='${{ steps.ver.outputs.version }}'
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg desc "Fork build v$v from ${GITHUB_SHA::8} ($(git log -1 --format=%s))" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/patches-$v.mpp" \
            --arg v "$v" \
            '{created_at: $ts, description: $desc, download_url: $url, signature_download_url: "", version: $v}' \
            > patches-bundle.json
          cat patches-bundle.json

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v='${{ steps.ver.outputs.version }}'
          gh release create "v$v" '${{ steps.bundle.outputs.path }}' \
            --title "v$v" \
            --notes "Fork build from ${GITHUB_SHA::8}. Based on upstream $(sed -nE 's/^version *= *([^ ]+).*/\1/p' gradle.properties)."

      - name: Commit metadata
        run: |
          v='${{ steps.ver.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: release v$v [skip ci]"
          git push
